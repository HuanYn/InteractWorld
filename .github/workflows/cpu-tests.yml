name: CPU reproduction contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install CPU-only dependencies and video codec tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Verify the CPU-only build
        run: python -c "import torch; assert torch.version.cuda is None; assert not torch.cuda.is_available()"
      - name: Run exported CPU tests without model downloads
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_run_abot_long_followthrough.py \
            --ignore=tests/test_prepare_abot_first_results.py \
            --ignore=tests/test_export_public_repro.py
