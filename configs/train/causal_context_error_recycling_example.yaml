# Experimental context-only recycling; not full SVI, DMD, CD, or a quality claim.
# Fill actual absolute paths/hashes; no model weights or private runtime are included.
# Paired control: change only enabled to false and output_dir to a fresh control path.
# Keep max_steps=200; use --stop-after-step 20 for the first resumable execution segment.
model:
