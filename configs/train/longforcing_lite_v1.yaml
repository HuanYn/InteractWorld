model:
  base_model_path: /path/to/interactworld/models/Wan2.2-TI2V-5B@921dbaf3f1674a56f47e83fb80a34bac8a8f203e
  model_type: ci2v
  timestep_shift: 5.0
  lora_rank: 16
  lora_alpha: 16.0
  lora_dropout: 0.0
  action_dim: 32
  latent_channels: 48
  temporal_compression: 4
  spatial_compression: 16
  num_frame_per_block: 3
  rgb_frames_per_latent: 4
  downscale_factor_control_adapter: 16
  local_attn_size: -1
  gradient_checkpointing: true

data:
  manifest_path: /path/to/interactworld/data/manifests/train.jsonl
  manifest_sha256: null
  feature_index_path: /path/to/interactworld/data/features/train.features.jsonl
  feature_receipt_path: /path/to/interactworld/data/features/train.features.jsonl.receipt.json
  long_feature_index_path: /path/to/interactworld/data/features/train.long241.features.jsonl
  long_feature_receipt_path: /path/to/interactworld/data/features/train.long241.features.jsonl.receipt.json
  data_factory: training.data.longforcing_dataset:build_longforcing_dataloader
  precomputed_latents: true
  precomputed_text_embeddings: true
  canonical_action_keys: [W, A, S, D, I, J, K, L]
  height: 480
  width: 832
  fps: 16
  short_window_frames: 49
  demo_rollout_frames: 241
  num_workers: 4

lineage:
  teacher_checkpoint_path: /path/to/interactworld/runs/action_teacher_lora_v1/checkpoints/best.pt
  teacher_checkpoint_sha256: null
  causal_checkpoint_path: /path/to/interactworld/runs/causal_teacher_forcing_v1/checkpoints/best.pt
  causal_checkpoint_sha256: null
  expected_teacher_stage: action_teacher_lora_v1
  expected_causal_stage: causal_teacher_forcing_v1

rollout:
  backend_factory: training.longforcing_lite:wan_longforcing_backend_factory
  student_steps: 4
  teacher_steps: 40
  curriculum_depths: [1, 4, 8, 20]
  curriculum_start_steps: [0, 100, 300, 600]
  flowmatch_replay_fraction: 0.25
  only_last_block_backward: true
  teacher_stop_gradient: true
  teacher_cpu_offload: true
  solver: euler
  is_dmd: false

optimizer:
  name: adamw8bit
  adapter_lr: 0.00002
  lora_lr: 0.00001
  betas: [0.9, 0.95]
  weight_decay: 0.01
  max_grad_norm: 1.0

training:
  precision: bf16
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 1000
  checkpoint_every: 50
  keep_last: 2
  keep_best: 1
  seed: 42
  output_dir: /path/to/interactworld/runs/longforcing_lite_v1
  log_every: 1
